<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch recent</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5EE0C6}a:hover{color:#7FF2DA}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 208px; height: 248px; box-sizing: border-box; background: #000000; color: #F4F3F8; font-family: 'Inter', system-ui, sans-serif; border-radius: 44px; overflow: hidden; display: flex; flex-direction: column; padding: 12px 10px 10px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 10px; height: 22px">
<a href="Home.dc.html" style="display: flex; align-items: center; gap: 2px; font-size: 14px; font-weight: 700; color: #5EE0C6; text-decoration: none"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Recent</a>
<span style="font-size: 14px; font-weight: 600">9:50</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 8px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<a href="Playback.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; padding: 5px 12px; border-radius: 16px; background: #1C1C23; color: #F4F3F8; text-decoration: none; animation: rise .35s {{it.delay}}s both">
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</span><span style="font-size: 11px; color: #B9B7C8">{{it.meta}}</span></span>
<sc-if value="{{it.delivered}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5EE0C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="Delivered" role="img"><path d="M5 12l5 5L20 7"/></svg></sc-if>
<sc-if value="{{it.waiting}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="Waiting for iPhone" style="width: 13px; height: 13px; border-radius: 7px; border: 2px solid #3A3A46; border-top-color: #FFB86B; box-sizing: border-box; animation: spin 1.2s linear infinite"></span></sc-if>
</a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":208,"height":248}}'>
class Component extends DCLogic {
renderVals() {
const raw = [['Memo 9:49', 'Today · 0:58', false], ['Onboarding idea', 'Today · 1:24', true], ['Grocery list', 'Yesterday · 0:31', true], ['Gift ideas', 'Oct 23 · 0:47', true]];
const items = raw.map((r, i) => ({ title: r[0], meta: r[1], delivered: r[2], waiting: !r[2], delay: (0.05 + i * 0.05).toFixed(2) }));
return { items };
}
}
</script>
</body>
</html>
