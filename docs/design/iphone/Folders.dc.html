<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folders</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5EE0C6}a:hover{color:#7FF2DA}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.press{transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .25s}
.press:active{transform:scale(.97)!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111116; color: #F4F3F8; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="padding: 58px 16px 0; display: flex; justify-content: space-between; align-items: center; animation: rise .5s cubic-bezier(.2,.8,.2,1) both">
<a href="Library.dc.html" aria-label="Back to library" style="width: 44px; height: 44px; border-radius: 22px; background: #1C1C23; border: 1px solid #2A2A33; display: flex; align-items: center; justify-content: center; color: #F4F3F8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<button class="press" onClick="{{openNew}}" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #5EE0C6; color: #06231E; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New folder</button>
</div>
<div style="padding: 14px 20px 0; animation: rise .55s .05s cubic-bezier(.2,.8,.2,1) both">
<h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.03em">Folders</h1>
<p style="margin: 6px 0 0; font-size: 14px; color: #B9B7C8">{{count}} folders · 21 notes</p>
</div>

<div style="padding: 18px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{folders}}" as="f" hint-placeholder-count="6">
<a href="Library.dc.html" class="press" style="display: flex; flex-direction: column; gap: 20px; padding: 16px; border-radius: 20px; background: #1C1C23; border: 1px solid #2A2A33; text-decoration: none; color: #F4F3F8; animation: rise .5s {{f.delay}}s cubic-bezier(.2,.8,.2,1) both">
<span style="width: 42px; height: 42px; border-radius: 13px; background: {{f.color}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111116" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 700">{{f.name}}</span><span style="font-size: 13px; color: #B9B7C8">{{f.meta}}</span></span>
</a>
</sc-for>
</div>

<sc-if value="{{showNew}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: flex; flex-direction: column; justify-content: flex-end">
<button aria-label="Close" onClick="{{closeNew}}" style="flex-grow: 1; border: none; background: transparent"></button>
<div style="background: #1C1C23; border-top: 1px solid #2A2A33; border-radius: 28px 28px 0 0; padding: 12px 20px 34px; display: flex; flex-direction: column; gap: 16px; animation: sheet .4s cubic-bezier(.2,.8,.2,1) both">
<span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #3A3A46"></span>
<h2 style="margin: 0; font-size: 20px; font-weight: 700">New folder</h2>
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: #B9B7C8">Name</span><input type="text" value="Interviews" style="height: 50px; border-radius: 14px; border: 1.5px solid #5EE0C6; background: #111116; color: #F4F3F8; font: inherit; font-size: 16px; padding: 0 14px; outline: none"></label>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: #B9B7C8">Color</span>
<div style="display: flex; gap: 12px">
<sc-for list="{{swatches}}" as="s" hint-placeholder-count="5">
<button aria-label="{{s.label}}" onClick="{{s.pick}}" class="press" style="width: 40px; height: 40px; border-radius: 20px; border: 3px solid {{s.ring}}; background: {{s.color}}; box-sizing: border-box"></button>
</sc-for>
</div></div>
<button class="press" onClick="{{closeNew}}" style="height: 54px; border-radius: 18px; border: none; background: #5EE0C6; color: #06231E; font: inherit; font-size: 17px; font-weight: 700">Create folder</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const raw = [
['Meetings', '8 notes · 5h 12m', '#5EE0C6'],
['Lectures', '6 notes · 7h 40m', '#A9B4FF'],
['Ideas', '4 notes · 9m', '#FFB86B'],
['Interviews', '2 notes · 1h 05m', '#FF8FA3'],
['Journal', '1 note · 4m', '#8FD3FF'],
['From Watch', 'Smart folder', '#D8D6E4']
];
const folders = raw.map((f, i) => ({ name: f[0], meta: f[1], color: f[2], delay: (0.1 + i * 0.05).toFixed(2) }));
const colors = ['#5EE0C6', '#A9B4FF', '#FFB86B', '#FF8FA3', '#8FD3FF'];
const names = ['Teal', 'Lavender', 'Orange', 'Pink', 'Sky'];
const pick = st.swatch == null ? 3 : st.swatch;
const swatches = colors.map((c, i) => ({ color: c, label: names[i], ring: i === pick ? '#F4F3F8' : 'transparent', pick: () => this.setState({ swatch: i }) }));
return {
folders,
count: folders.length,
swatches,
showNew: !!st.open,
openNew: () => this.setState({ open: true }),
closeNew: () => this.setState({ open: false })
};
}
}
</script>
</body>
</html>
