<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Murmur Pro</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#7FF2DA}a:hover{color:#B5FFF0}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,50px) scale(1.25)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-70px,40px) scale(.9)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-60px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(-2deg)}}
@keyframes wave{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@keyframes sweep{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(420%) skewX(-20deg)}}
@keyframes halo{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
@keyframes spin{to{transform:rotate(360deg)}}
.glass{background:#1C1C23;border:1px solid #2A2A33}
.press{transition:transform .22s cubic-bezier(.2,.8,.2,1),background .3s,border-color .3s,box-shadow .3s}
.press:active{transform:scale(.97)!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111116; color: #F4F3F8; font-family: 'Inter', system-ui, sans-serif; position: relative; overflow: hidden">

<div style="position: relative; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; padding: 54px 20px 26px">
<div style="display: flex; justify-content: flex-end">
<a href="Library.dc.html" class="glass press" aria-label="Close" style="width: 40px; height: 40px; border-radius: 20px; color: #D8D6E4; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 18px">
<div style="position: relative; width: 104px; height: 104px; animation: float 4.5s ease-in-out infinite">
<svg width="104" height="104" viewBox="0 0 100 100" role="img" aria-label="Murmur icon" style="position: relative"><rect width="100" height="100" rx="22.5" fill="#15151B"/><rect x="0.5" y="0.5" width="99" height="99" rx="22" fill="none" stroke="rgba(255,255,255,0.15)"/><g stroke="#5EE0C6" stroke-width="7.5" stroke-linecap="round"><line x1="26" y1="27" x2="26" y2="73" style="transform-origin: 26px 50px; animation: wave 1.4s ease-in-out infinite"/><line x1="38" y1="35" x2="38" y2="62" style="transform-origin: 38px 50px; animation: wave 1.4s ease-in-out -.2s infinite"/><line x1="50" y1="45" x2="50" y2="55" style="transform-origin: 50px 50px; animation: wave 1.4s ease-in-out -.4s infinite"/><line x1="62" y1="35" x2="62" y2="62" style="transform-origin: 62px 50px; animation: wave 1.4s ease-in-out -.6s infinite"/><line x1="74" y1="27" x2="74" y2="73" style="transform-origin: 74px 50px; animation: wave 1.4s ease-in-out -.8s infinite"/></g></svg>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; animation: rise .6s .05s cubic-bezier(.2,.8,.2,1) both">
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em">Murmur <span style="color: #5EE0C6">Pro</span></h1>
<p style="margin: 0; font-size: 15px; color: #D8D6E4">Unlimited, private transcription. No cloud, ever.</p>
</div>
</div>

<div class="glass" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; margin-top: 22px; border-radius: 22px; padding: 16px; animation: rise .6s .12s cubic-bezier(.2,.8,.2,1) both">
<sc-for list="{{perks}}" as="p" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 30px; height: 30px; border-radius: 10px; background: {{p.grad}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0A0A12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span>
<span style="font-size: 13px; font-weight: 500; color: #ECEBF2; line-height: 1.3">{{p.text}}</span>
</div>
</sc-for>
</div>

<div role="radiogroup" aria-label="Choose a plan" style="display: flex; flex-direction: column; gap: 10px; margin-top: 16px">
<sc-for list="{{plans}}" as="pl" hint-placeholder-count="3">
<button role="radio" aria-checked="{{pl.checked}}" class="press" onClick="{{pl.pick}}" style="position: relative; text-align: left; font: inherit; color: inherit; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; border: 1.5px solid {{pl.border}}; background: {{pl.bg}}; box-shadow: {{pl.shadow}}; backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%); animation: rise .5s {{pl.delay}}s cubic-bezier(.2,.8,.2,1) both">
<span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{pl.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; transition: border-color .25s"><span style="width: 10px; height: 10px; border-radius: 5px; background: #5EE0C6; transform: scale({{pl.dotScale}}); transition: transform .35s cubic-bezier(.2,.8,.2,1)"></span></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 700">{{pl.name}}</span>
<span style="font-size: 13px; color: #B9B7C8">{{pl.sub}}</span>
</span>
<span style="font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums">{{pl.price}}</span>
<sc-if value="{{pl.hasBadge}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; top: -10px; right: 14px; height: 20px; padding: 0 9px; border-radius: 10px; background: {{pl.badgeBg}}; color: #06231E; font-size: 10px; font-weight: 800; display: flex; align-items: center; letter-spacing: 0.06em">{{pl.badge}}</span>
</sc-if>
</button>
</sc-for>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; animation: rise .6s .5s cubic-bezier(.2,.8,.2,1) both">
<button class="press" style="width: 100%; height: 58px; border-radius: 18px; border: none; background: #5EE0C6; color: #06231E; font: inherit; font-size: 17px; font-weight: 800">
<span>{{cta}}</span>
</button>
<div style="display: flex; justify-content: center; gap: 18px">
<button style="border: none; background: transparent; color: #B9B7C8; font: inherit; font-size: 13px; min-height: 44px; padding: 0 4px">Restore purchases</button>
<a href="#terms" style="color: #B9B7C8; font-size: 13px; display: flex; align-items: center; min-height: 44px">Terms</a>
<a href="#privacy" style="color: #B9B7C8; font-size: 13px; display: flex; align-items: center; min-height: 44px">Privacy</a>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const sel = st.plan || 'yearly';
const perks = [
['Unlimited length', '#5EE0C6'],
['Speaker labels', '#FFB86B'],
['AI summaries', '#A9B4FF'],
['iPhone, Mac & Watch', '#8FD3FF']
].map((p) => ({ text: p[0], grad: p[1] }));
const raw = [
{ id: 'yearly', name: 'Yearly', sub: '$1.67 a month · 7-day free trial', price: '$19.99', badge: 'BEST VALUE' },
{ id: 'lifetime', name: 'Lifetime', sub: 'Pay once, yours forever', price: '$39.99', badge: 'NO SUBSCRIPTION' },
{ id: 'monthly', name: 'Monthly', sub: 'Cancel anytime', price: '$3.99', badge: '' }
];
const plans = raw.map((p, i) => {
const on = p.id === sel;
return {
name: p.name,
sub: p.sub,
price: p.price,
badge: p.badge,
hasBadge: !!p.badge,
badgeBg: i === 0 ? '#5EE0C6' : '#A9B4FF',
checked: on ? 'true' : 'false',
border: on ? '#5EE0C6' : '#2A2A33',
bg: on ? '#16302B' : '#1C1C23',
shadow: 'none',
ring: on ? '#5EE0C6' : '#4A4A56',
dotScale: on ? 1 : 0,
delay: (0.24 + i * 0.06).toFixed(2),
pick: () => this.setState({ plan: p.id })
};
});
const cta = sel === 'yearly' ? 'Start 7-day free trial' : sel === 'lifetime' ? 'Unlock forever · $39.99' : 'Continue · $3.99/month';
return { perks, plans, cta };
}
}
</script>
</body>
</html>
