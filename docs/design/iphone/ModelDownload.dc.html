<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Model download</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5EE0C6}a:hover{color:#7FF2DA}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes drop{0%{transform:translateY(-6px)}50%{transform:translateY(4px)}100%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.press{transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .25s,border-color .25s}
.press:active{transform:scale(.97)!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111116; color: #F4F3F8; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; padding: 76px 24px 40px">
<div style="display: flex; flex-direction: column; gap: 14px; animation: rise .6s cubic-bezier(.2,.8,.2,1) both">
<div style="width: 64px; height: 64px; border-radius: 20px; background: #1C1C23; border: 1px solid #2A2A33; display: flex; align-items: center; justify-content: center">
<sc-if value="{{notDone}}" hint-placeholder-val="{{true}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5EE0C6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation: drop 1.4s ease-in-out infinite; animation-play-state: {{dropState}}"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg></sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5EE0C6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation: pop .45s cubic-bezier(.2,.8,.2,1) both"><path d="M5 12l5 5L20 7"/></svg></sc-if>
</div>
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15">{{title}}</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #B9B7C8">{{body}}</p>
</div>

<div role="radiogroup" aria-label="Speech model" style="display: flex; flex-direction: column; gap: 10px; margin-top: 28px">
<sc-for list="{{models}}" as="m" hint-placeholder-count="2">
<button role="radio" aria-checked="{{m.checked}}" class="press" onClick="{{m.pick}}" style="text-align: left; font: inherit; color: inherit; display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 18px; border: 1.5px solid {{m.border}}; background: {{m.bg}}; opacity: {{m.op}}; animation: rise .5s {{m.delay}}s cubic-bezier(.2,.8,.2,1) both">
<span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{m.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: #5EE0C6; transform: scale({{m.dot}}); transition: transform .3s cubic-bezier(.2,.8,.2,1)"></span></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
<span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 16px; font-weight: 700">{{m.name}}</span><sc-if value="{{m.rec}}" hint-placeholder-val="{{false}}"><span style="height: 20px; padding: 0 8px; border-radius: 10px; background: #5EE0C6; color: #06231E; font-size: 10px; font-weight: 800; letter-spacing: 0.06em; display: flex; align-items: center">RECOMMENDED</span></sc-if></span>
<span style="font-size: 13px; color: #B9B7C8">{{m.sub}}</span>
</span>
<span style="font-size: 14px; font-weight: 600; color: #D8D6E4">{{m.size}}</span>
</button>
</sc-for>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding: 14px 16px; border-radius: 18px; background: #1C1C23; border: 1px solid #2A2A33; animation: rise .5s .3s cubic-bezier(.2,.8,.2,1) both">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Download on Wi‑Fi only</span><span style="font-size: 13px; color: #B9B7C8">Avoids using mobile data</span></span>
<button role="switch" aria-checked="{{wifiChecked}}" aria-label="Download on Wi-Fi only" onClick="{{toggleWifi}}" style="flex-shrink: 0; width: 51px; height: 31px; border-radius: 16px; border: none; padding: 2px; background: {{wifiTrack}}; transition: background-color .25s; display: flex">
<span style="width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF; transform: translateX({{wifiX}}px); transition: transform .3s cubic-bezier(.2,.8,.2,1)"></span>
</button>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{downloading}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 8px; animation: rise .4s cubic-bezier(.2,.8,.2,1) both">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #B9B7C8; font-variant-numeric: tabular-nums"><span>{{got}} of {{total}}</span><span>{{pct}}%</span></div>
<div style="height: 8px; border-radius: 4px; background: #26262E; overflow: hidden"><div style="height: 8px; border-radius: 4px; background: #5EE0C6; width: {{pct}}%; transition: width .3s linear"></div></div>
</div>
</sc-if>
<sc-if value="{{choosing}}" hint-placeholder-val="{{true}}">
<button class="press" onClick="{{start}}" style="width: 100%; height: 56px; border-radius: 18px; border: none; background: #5EE0C6; color: #06231E; font: inherit; font-size: 17px; font-weight: 700">Download model</button>
</sc-if>
<sc-if value="{{downloading}}" hint-placeholder-val="{{false}}">
<button class="press" onClick="{{cancel}}" style="width: 100%; height: 56px; border-radius: 18px; border: 1px solid #2A2A33; background: #1C1C23; color: #F4F3F8; font: inherit; font-size: 16px; font-weight: 600">Cancel</button>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<a href="Empty.dc.html" class="press" style="height: 56px; border-radius: 18px; background: #5EE0C6; color: #06231E; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; animation: rise .4s cubic-bezier(.2,.8,.2,1) both">Start using Murmur</a>
</sc-if>
<span style="text-align: center; font-size: 12px; color: #8F8D9C">You can switch models anytime in Settings.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const st = this.state || {};
const phase = st.phase || 'choose';
const sel = st.model || 'large';
const wifi = st.wifi !== false;
const p = st.p || 0;
const specs = { large: 1.6, small: 0.5 };
const total = specs[sel];
const models = [
{ id: 'large', name: 'Best accuracy', sub: 'Whisper Large v3 Turbo · 100+ languages', size: '≈1.6 GB', rec: true },
{ id: 'small', name: 'Faster & lighter', sub: 'Whisper Small · good for clear speech', size: '≈0.5 GB', rec: false }
].map((m, i) => {
const on = m.id === sel;
return {
...m,
checked: on ? 'true' : 'false',
border: on ? '#5EE0C6' : '#2A2A33',
bg: on ? '#16302B' : '#1C1C23',
ring: on ? '#5EE0C6' : '#4A4A56',
dot: on ? 1 : 0,
op: phase === 'choose' || on ? 1 : 0.45,
delay: (0.12 + i * 0.07).toFixed(2),
pick: () => { if (phase === 'choose') this.setState({ model: m.id }); }
};
});
const titles = {
choose: ['Download the speech model', 'One-time download. After this, Murmur works fully offline.'],
downloading: ['Downloading…', 'Keep Murmur open. This takes a few minutes on Wi‑Fi.'],
done: ['You’re all set', 'The model is on your iPhone. Recording and transcribing now work offline.']
};
return {
title: titles[phase][0],
body: titles[phase][1],
models,
choosing: phase === 'choose',
downloading: phase === 'downloading',
done: phase === 'done',
notDone: phase !== 'done',
dropState: phase === 'downloading' ? 'running' : 'paused',
pct: p,
got: (total * p / 100).toFixed(2) + ' GB',
total: total.toFixed(1) + ' GB',
wifiChecked: wifi ? 'true' : 'false',
wifiTrack: wifi ? '#5EE0C6' : '#3A3A46',
wifiX: wifi ? 20 : 0,
toggleWifi: () => this.setState({ wifi: !wifi }),
start: () => {
this.setState({ phase: 'downloading', p: 0 });
clearInterval(this.timer);
this.timer = setInterval(() => {
const cur = (this.state && this.state.p) || 0;
if (cur >= 100) { clearInterval(this.timer); this.setState({ phase: 'done' }); return; }
this.setState({ p: Math.min(100, cur + 4) });
}, 140);
},
cancel: () => { clearInterval(this.timer); this.setState({ phase: 'choose', p: 0 }); }
};
}
}
</script>
</body>
</html>
