<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5EE0C6}a:hover{color:#7FF2DA}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.press{transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .25s}
.press:active{transform:scale(.98)!important}
.row{transition:background-color .2s}
.row:active{background-color:#26262E}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111116; color: #F4F3F8; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 58px 16px 0; display: flex; align-items: center; justify-content: space-between; animation: rise .5s cubic-bezier(.2,.8,.2,1) both">
<a href="Library.dc.html" aria-label="Back to library" style="width: 44px; height: 44px; border-radius: 22px; background: #1C1C23; border: 1px solid #2A2A33; display: flex; align-items: center; justify-content: center; color: #F4F3F8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
</div>
<h1 style="margin: 0; padding: 12px 20px 0; font-size: 34px; font-weight: 800; letter-spacing: -0.03em; animation: rise .55s .04s cubic-bezier(.2,.8,.2,1) both">Settings</h1>

<div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 18px">
<a href="Paywall.dc.html" class="press" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: #16302B; border: 1px solid #2D5A50; text-decoration: none; color: #F4F3F8; animation: rise .5s .08s cubic-bezier(.2,.8,.2,1) both">
<span style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; background: #15151B; border: 1px solid #2A2A33; display: flex; align-items: center; justify-content: center; gap: 2px">
<span style="width: 3px; height: 18px; border-radius: 2px; background: #5EE0C6"></span><span style="width: 3px; height: 11px; border-radius: 2px; background: #5EE0C6"></span><span style="width: 3px; height: 5px; border-radius: 2px; background: #5EE0C6"></span><span style="width: 3px; height: 11px; border-radius: 2px; background: #5EE0C6"></span><span style="width: 3px; height: 18px; border-radius: 2px; background: #5EE0C6"></span>
</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">Murmur Pro</span><span style="font-size: 13px; color: #9FDCCF">Lifetime · Active</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8F8D9C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
</a>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 8px; animation: rise .5s {{g.delay}}s cubic-bezier(.2,.8,.2,1) both">
<h2 style="margin: 0; padding: 0 6px; font-size: 12px; font-weight: 700; color: #B9B7C8; letter-spacing: 0.1em; text-transform: uppercase">{{g.title}}</h2>
<div style="border-radius: 18px; background: #1C1C23; border: 1px solid #2A2A33; overflow: hidden">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<div class="row" style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 14px; border-top: 1px solid {{r.divider}}">
<span style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 9px; background: {{r.color}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111116" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg></span>
<span style="flex-grow: 1; font-size: 15px">{{r.label}}</span>
<sc-if value="{{r.isLink}}" hint-placeholder-val="{{true}}">
<a href="{{r.href}}" style="display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; color: #B9B7C8; text-decoration: none">{{r.value}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8F8D9C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
</sc-if>
<sc-if value="{{r.isToggle}}" hint-placeholder-val="{{false}}">
<button role="switch" aria-checked="{{r.checked}}" aria-label="{{r.label}}" onClick="{{r.toggle}}" style="flex-shrink: 0; width: 51px; height: 31px; border-radius: 16px; border: none; padding: 2px; background: {{r.track}}; transition: background-color .25s; display: flex">
<span style="width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF; transform: translateX({{r.x}}px); transition: transform .3s cubic-bezier(.2,.8,.2,1)"></span>
</button>
</sc-if>
</div>
</sc-for>
</div>
</div>
</sc-for>
<p style="margin: 0; text-align: center; font-size: 12px; color: #8F8D9C">Murmur 1.0 · Everything stays on this iPhone</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const t = st.t || { del: false, drafts: true, haptics: true };
const flip = (k) => () => { const n = Object.assign({}, t); n[k] = !n[k]; this.setState({ t: n }); };
const link = (label, value, color, icon, href) => ({ label, value, color, icon, href: href || '#', isLink: true, isToggle: false });
const tog = (label, key, color, icon) => ({ label, color, icon, isLink: false, isToggle: true, checked: t[key] ? 'true' : 'false', track: t[key] ? '#5EE0C6' : '#3A3A46', x: t[key] ? 20 : 0, toggle: flip(key) });
const raw = [
{ title: 'Transcription', rows: [
link('Language', 'Auto-detect', '#5EE0C6', 'M4 5h8M8 3v2M6 5c0 4 3 7 6 8M10 5c0 3-2 6-6 8M13 21l4-10 4 10M14.5 17h5'),
link('Speech model', 'Large v3 Turbo', '#A9B4FF', 'M12 2a3 3 0 0 0-3 3v1a3 3 0 0 0-3 3v1a3 3 0 0 0 0 6v1a3 3 0 0 0 6 0V5a3 3 0 0 0 0-3zM12 2a3 3 0 0 1 3 3v1a3 3 0 0 1 3 3v1a3 3 0 0 1 0 6v1a3 3 0 0 1-6 0', 'ModelDownload.dc.html'),
link('Custom dictionary', '8 words', '#FFB86B', 'M4 4h11a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4zM8 8h7M8 12h5', 'Dictionary.dc.html')
] },
{ title: 'Recording', rows: [
link('Audio format', 'M4A', '#8FD3FF', 'M9 18V5l11-2v13M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3zM20 16a3 3 0 1 1-3-3 3 3 0 0 1 3 3z'),
tog('Delete audio after transcribing', 'del', '#FF8FA3', 'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3'),
tog('Haptics', 'haptics', '#D8D6E4', 'M7 4h10v16H7zM3 9v6M21 9v6')
] },
{ title: 'Support', rows: [
link('Restore purchases', '', '#5EE0C6', 'M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4'),
link('Send feedback', '', '#A9B4FF', 'M4 4h16v12H8l-4 4z')
] }
];
const groups = raw.map((g, gi) => ({
title: g.title,
delay: (0.14 + gi * 0.06).toFixed(2),
rows: g.rows.map((r, i) => Object.assign({}, r, { divider: i === 0 ? 'transparent' : '#2A2A33' }))
}));
return { groups };
}
}
</script>
</body>
</html>
