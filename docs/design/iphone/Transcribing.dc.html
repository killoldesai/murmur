<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Murmur Transcribing</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7FF2DA}a:hover{color:#B5FFF0}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,50px) scale(1.2)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-60px,-50px) scale(.9)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-50px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.1);opacity:1}}
.glass{background:#1C1C23;border:1px solid #2A2A33}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.8}}
.press{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.press:active{transform:scale(.96)!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111116; color: #F4F3F8; font-family: 'Inter', system-ui, sans-serif; position: relative; overflow: hidden">

<div style="position: relative; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; padding: 70px 20px 38px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 26px; margin-top: 24px; animation: rise .7s cubic-bezier(.2,.8,.2,1) both">
<div style="position: relative; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center">
<div class="glass" style="position: absolute; inset: 18px; border-radius: 82px; background: #18181F"></div>
<svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="{{ariaProgress}}" style="position: absolute; inset: 0; transform: rotate(-90deg); overflow: visible">
<defs>
<linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#B5FFF0"/><stop offset="50%" stop-color="#5EE0C6"/><stop offset="100%" stop-color="#4F8BFF"/></linearGradient>
<filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<circle cx="100" cy="100" r="88" fill="none" stroke="#26262E" stroke-width="9"/>
<circle cx="100" cy="100" r="88" fill="none" stroke="#5EE0C6" stroke-width="9" stroke-linecap="round" stroke-dasharray="552.9" stroke-dashoffset="{{offset}}" style="transition: stroke-dashoffset .45s cubic-bezier(.2,.8,.2,1)"/>
</svg>
<svg aria-hidden="true" width="200" height="200" viewBox="0 0 200 200" style="position: absolute; inset: 0; animation: spin 2.2s linear infinite; opacity: {{spinnerOpacity}}; transition: opacity .4s"><circle cx="100" cy="12" r="4" fill="#F4F3F8"/></svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative">
<span style="font-size: 50px; font-weight: 200; font-variant-numeric: tabular-nums; letter-spacing: -0.03em">{{pct}}<span style="font-size: 24px; color: #B9B7C8">%</span></span>
<span style="font-size: 13px; color: #B9B7C8">{{eta}}</span>
</div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<h1 style="margin: 0; font-size: 23px; font-weight: 600; letter-spacing: -0.01em; color: #F4F3F8">{{heading}}</h1>
<p style="margin: 0; font-size: 14px; color: #B9B7C8; line-height: 1.5; max-width: 290px">Whisper runs right on your iPhone. Nothing is uploaded, ever.</p>
</div>
</div>

<div class="glass" style="align-self: stretch; margin-top: 28px; display: flex; flex-direction: column; gap: 12px; border-radius: 24px; padding: 18px; flex-grow: 1; overflow: hidden; animation: rise .7s .15s cubic-bezier(.2,.8,.2,1) both">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #B9B7C8; letter-spacing: 0.1em; text-transform: uppercase"><span style="width: 6px; height: 6px; border-radius: 3px; background: #5EE0C6; animation: pulse 1.2s ease-in-out infinite"></span>Live preview</span>
<sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
<div style="display: flex; gap: 12px; animation: rise .5s cubic-bezier(.2,.8,.2,1) both">
<span style="font-size: 12px; color: #9FF7E4; font-variant-numeric: tabular-nums; padding-top: 2px; min-width: 38px">{{l.t}}</span>
<span style="font-size: 15px; line-height: 1.5; color: #ECEBF2">{{l.text}}</span>
</div>
</sc-for>
<sc-if value="{{working}}" hint-placeholder-val="{{true}}">
<div aria-hidden="true" style="display: flex; gap: 12px; align-items: center">
<span style="min-width: 38px"></span>
<span style="height: 12px; width: 72%; border-radius: 6px; background: #2E2E38; animation: pulse 1.2s ease-in-out infinite"></span>
</div>
</sc-if>
</div>

<div style="align-self: stretch; margin-top: 16px">
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<a href="Note.dc.html" class="press" style="height: 56px; border-radius: 18px; background: #5EE0C6; color: #06231E; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; animation: rise .5s cubic-bezier(.2,.8,.2,1) both">Open transcript</a>
</sc-if>
<sc-if value="{{working}}" hint-placeholder-val="{{true}}">
<button class="glass press" style="width: 100%; height: 56px; border-radius: 18px; color: #D8D6E4; font: inherit; font-size: 16px">Transcribe later</button>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() {
this.setState({ p: 8 });
this.timer = setInterval(() => {
const p = (this.state && this.state.p) || 0;
if (p >= 100) { clearInterval(this.timer); return; }
this.setState({ p: Math.min(100, p + 3) });
}, 260);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const p = (this.state && this.state.p) || 8;
const all = [
{ t: '00:04', text: 'Okay, let’s start with the Q4 roadmap.' },
{ t: '00:11', text: 'The big question is Watch first or sync first.' },
{ t: '00:19', text: 'Watch is smaller and users keep asking for it.' },
{ t: '00:27', text: 'Agreed. Let’s move sync to December.' },
{ t: '00:34', text: 'I’ll update the timeline by Friday.' }
];
const shown = Math.max(1, Math.min(all.length, Math.ceil(p / 20)));
const done = p >= 100;
const left = Math.max(0, Math.round((100 - p) * 0.9));
return {
pct: p,
offset: (552.9 * (1 - p / 100)).toFixed(1),
lines: all.slice(0, shown),
done,
working: !done,
heading: done ? 'Transcript ready' : 'Transcribing on your iPhone',
eta: done ? 'Done' : 'About ' + left + 's left',
spinnerOpacity: done ? 0 : 1,
ariaProgress: 'Transcription ' + p + ' percent complete'
};
}
}
</script>
</body>
</html>
