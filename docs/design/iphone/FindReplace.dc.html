<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Find and replace</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5EE0C6}a:hover{color:#7FF2DA}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes flip{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes toast{0%{opacity:0;transform:translateY(20px)}12%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(10px)}}
.press{transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .25s,color .25s,border-color .25s,opacity .25s}
.press:active{transform:scale(.96)!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111116; color: #F4F3F8; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
<div style="padding: 58px 16px 16px; display: flex; flex-direction: column; gap: 10px; background: #1C1C23; border-bottom: 1px solid #2A2A33; animation: rise .5s cubic-bezier(.2,.8,.2,1) both">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 17px; font-weight: 700; padding-left: 4px">Find & replace</span>
<a href="Note.dc.html" style="height: 44px; padding: 0 6px; display: flex; align-items: center; font-size: 16px; color: #5EE0C6; font-weight: 600; text-decoration: none">Done</a>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 14px; background: #111116; border: 1.5px solid #5EE0C6">
<span style="font-size: 13px; color: #B9B7C8; width: 56px">Find</span>
<input type="text" value="Jordon" aria-label="Find" style="flex-grow: 1; min-width: 0; border: none; background: transparent; color: #F4F3F8; font: inherit; font-size: 16px; outline: none">
<span style="font-size: 12px; color: #B9B7C8; white-space: nowrap; font-variant-numeric: tabular-nums">{{counter}}</span>
</label>
<label style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 14px; background: #111116; border: 1px solid #2A2A33">
<span style="font-size: 13px; color: #B9B7C8; width: 56px">Replace</span>
<input type="text" value="Jordan" aria-label="Replace with" style="flex-grow: 1; min-width: 0; border: none; background: transparent; color: #F4F3F8; font: inherit; font-size: 16px; outline: none">
</label>
<div style="display: flex; gap: 8px">
<button class="press" onClick="{{prev}}" aria-label="Previous match" style="width: 44px; height: 42px; border-radius: 12px; border: 1px solid #2A2A33; background: #111116; color: #F4F3F8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
<button class="press" onClick="{{next}}" aria-label="Next match" style="width: 44px; height: 42px; border-radius: 12px; border: 1px solid #2A2A33; background: #111116; color: #F4F3F8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
<button class="press" onClick="{{replaceOne}}" style="flex-grow: 1; height: 42px; border-radius: 12px; border: 1px solid #2A2A33; background: #26262E; color: #F4F3F8; font: inherit; font-size: 14px; font-weight: 600; opacity: {{btnOp}}">Replace</button>
<button class="press" onClick="{{replaceAll}}" style="flex-grow: 1; height: 42px; border-radius: 12px; border: none; background: #5EE0C6; color: #06231E; font: inherit; font-size: 14px; font-weight: 700; opacity: {{btnOp}}">Replace all</button>
</div>
<label style="display: flex; align-items: center; gap: 10px; padding: 4px 4px 0; font-size: 13px; color: #B9B7C8"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #5EE0C6; margin: 0">Also add “Jordan” to custom dictionary</label>
</div>

<div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="4">
<div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; animation: rise .5s {{l.delay}}s cubic-bezier(.2,.8,.2,1) both">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px"><span style="width: 22px; height: 22px; border-radius: 11px; background: {{l.color}}; color: #111116; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{l.initial}}</span><span style="font-weight: 600">{{l.who}}</span><span style="color: #B9B7C8">{{l.t}}</span></span>
<span style="font-size: 15px; line-height: 1.55; color: #D8D6E4">{{l.pre}}<sc-if value="{{l.hasWord}}" hint-placeholder-val="{{true}}"><mark style="display: inline-block; background: {{l.markBg}}; color: {{l.markFg}}; border-radius: 4px; padding: 0 3px; font-weight: 600; animation: {{l.anim}}">{{l.word}}</mark></sc-if>{{l.post}}</span>
</div>
</sc-for>
</div>

<sc-if value="{{showToast}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: absolute; left: 50%; bottom: 44px; margin-left: -110px; width: 220px; height: 48px; border-radius: 24px; background: #F4F3F8; color: #111116; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700; animation: toast 2.4s cubic-bezier(.2,.8,.2,1) both">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F7A66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>{{toastText}}
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const done = st.done || [false, false, false];
const cur = st.cur || 0;
const data = [
['A', 'Alex', '#5EE0C6', '00:04', 'Okay, let’s start with the Q4 roadmap.', '', '', false],
['A', 'Alex', '#5EE0C6', '00:20', 'Over to you, ', 'Jordon', ' — how long is the sync work?', true],
['J', 'Jordan', '#A9B4FF', '00:24', 'Sync needs CloudKit migration work. ', 'Jordon', ' estimated three weeks.', true],
['P', 'Priya', '#FFB86B', '00:47', 'So ', 'Jordon', ' starts the spike next week.', true]
];
let k = -1;
const lines = data.map((d, i) => {
const has = d[7];
if (has) k += 1;
const idx = k;
const replaced = has && done[idx];
const isCur = has && !replaced && idx === cur;
return {
initial: d[0], who: d[1], color: d[2], t: d[3], pre: d[4],
word: replaced ? 'Jordan' : d[5],
post: d[6],
hasWord: has,
markBg: replaced ? '#16302B' : isCur ? '#5EE0C6' : '#3A3A46',
markFg: replaced ? '#5EE0C6' : isCur ? '#06231E' : '#F4F3F8',
anim: replaced ? 'flip .4s cubic-bezier(.2,.8,.2,1) both' : 'none',
delay: (0.1 + i * 0.05).toFixed(2)
};
});
const left = done.filter((x) => !x).length;
const firstLeft = (from, dir) => {
for (let s = 1; s <= 3; s++) {
const j = (from + dir * s + 3) % 3;
if (!done[j]) return j;
}
return from;
};
return {
lines,
counter: left === 0 ? 'No matches' : (cur + 1) + ' of 3',
btnOp: left === 0 ? 0.4 : 1,
showToast: !!st.toast,
toastText: st.toast || '',
next: () => this.setState({ cur: firstLeft(cur, 1) }),
prev: () => this.setState({ cur: firstLeft(cur, -1) }),
replaceOne: () => {
if (left === 0) return;
const nd = done.slice(); nd[cur] = true;
const nxt = nd.indexOf(false);
this.setState({ done: nd, cur: nxt < 0 ? cur : nxt, toast: null });
},
replaceAll: () => {
if (left === 0) return;
this.setState({ done: [true, true, true], toast: left + ' replaced' });
}
};
}
}
</script>
</body>
</html>
