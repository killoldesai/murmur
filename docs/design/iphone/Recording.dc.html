<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Murmur Recording</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7FF2DA}a:hover{color:#B5FFF0}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,60px) scale(1.2)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-60px,-40px) scale(.9)}}
@keyframes wave{0%,100%{transform:scaleY(.28)}50%{transform:scaleY(1)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes orb{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes halo{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.6);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.glass{background:#1C1C23;border:1px solid #2A2A33}
.press{transition:transform .22s cubic-bezier(.2,.8,.2,1),background .3s,color .3s,box-shadow .3s}
.press:active{transform:scale(.92)!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111116; color: #F4F3F8; font-family: 'Inter', system-ui, sans-serif; position: relative; overflow: hidden">

<div style="position: relative; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; padding: 62px 24px 46px">
<div style="align-self: stretch; display: flex; justify-content: space-between; align-items: center; animation: rise .6s cubic-bezier(.2,.8,.2,1) both">
<a href="Library.dc.html" class="glass press" style="height: 40px; padding: 0 16px; border-radius: 20px; display: flex; align-items: center; font-size: 15px; color: #F4F3F8; text-decoration: none">Cancel</a>
<div class="glass" style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 17px; font-size: 13px; color: #D8D6E4">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7FF2DA" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Private · Offline
</div>
</div>

<div style="flex-grow: 1; align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px">
<div style="position: relative; width: 260px; height: 260px; display: flex; align-items: center; justify-content: center; animation: rise .7s .08s cubic-bezier(.2,.8,.2,1) both">
<div aria-hidden="true" style="position: absolute; inset: 14px; border-radius: 116px; background: #16161C; border: 1px solid #22222A; animation: orb 2.4s ease-in-out infinite; animation-play-state: {{playState}}"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; border-radius: 130px; border: 3px solid #22222A; border-top-color: #5EE0C6; box-sizing: border-box; animation: spin 3s linear infinite; animation-play-state: {{playState}}"></div>
<div class="glass" style="width: 200px; height: 200px; border-radius: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<div style="display: flex; align-items: center; gap: 7px; font-size: 13px; color: {{statusColor}}; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; transition: color .3s"><span style="width: 7px; height: 7px; border-radius: 4px; background: {{statusColor}}; animation: blink 1.2s ease-in-out infinite; animation-play-state: {{playState}}"></span>{{statusLabel}}</div>
<div style="font-size: 52px; font-weight: 200; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">{{time}}</div>
<div style="font-size: 13px; color: #B9B7C8">New recording</div>
</div>
</div>

<div aria-hidden="true" style="display: flex; align-items: center; gap: 4px; height: 96px; animation: rise .7s .18s cubic-bezier(.2,.8,.2,1) both">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="34">
<span style="width: 4px; border-radius: 2px; background: #5EE0C6; height: {{b.h}}px; transform-origin: center; animation: wave {{b.dur}}s ease-in-out {{b.delay}}s infinite; animation-play-state: {{b.play}}; opacity: {{b.op}}; transition: opacity .4s"></span>
</sc-for>
</div>
</div>

<div class="glass" style="display: flex; align-items: center; gap: 30px; padding: 12px 22px; border-radius: 60px; animation: rise .7s .3s cubic-bezier(.2,.8,.2,1) both">
<button class="press" aria-label="Add bookmark" style="width: 54px; height: 54px; border-radius: 27px; border: 1px solid #2A2A33; background: #26262E; color: #F4F3F8; display: flex; align-items: center; justify-content: center"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
<div style="position: relative; width: 78px; height: 78px">
<span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 39px; border: 2px solid #FF5A6E; animation: halo 1.8s cubic-bezier(.2,.8,.2,1) infinite; animation-play-state: {{playState}}"></span>
<a href="Transcribing.dc.html" class="press" aria-label="Stop and transcribe" style="position: absolute; inset: 0; border-radius: 39px; background: #FF5A6E; display: flex; align-items: center; justify-content: center; text-decoration: none"><span style="width: 24px; height: 24px; border-radius: 7px; background: #FFFFFF"></span></a>
</div>
<button class="press" onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width: 54px; height: 54px; border-radius: 27px; border: 1px solid rgba(255,255,255,0.14); background: {{toggleBg}}; color: {{toggleFg}}; box-shadow: {{toggleShadow}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.8l-10-6.5A1 1 0 0 0 8 5.5z"/></svg></sc-if>
<sc-if value="{{running}}" hint-placeholder-val="{{true}}"><svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></sc-if>
</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() {
this.setState({ secs: 768, paused: false });
this.timer = setInterval(() => {
if (!this.state.paused) this.setState({ secs: (this.state.secs || 768) + 1 });
}, 1000);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const s = this.state || {};
const paused = !!s.paused;
const secs = s.secs || 768;
const mm = String(Math.floor(secs / 60)).padStart(2, '0');
const ss = String(secs % 60).padStart(2, '0');
const hs = [14,22,34,26,44,58,40,30,52,74,62,42,30,56,90,70,50,36,60,84,66,46,32,54,72,56,38,26,44,62,48,32,22,14];
const play = paused ? 'paused' : 'running';
const bars = hs.map((h, i) => ({
h,
dur: (0.9 + (i % 5) * 0.13).toFixed(2),
delay: (-(i * 0.07)).toFixed(2),
play,
op: paused ? 0.3 : 1
}));
return {
bars,
time: mm + ':' + ss,
paused,
running: !paused,
playState: play,
auroraOpacity: paused ? 0.35 : 1,
statusLabel: paused ? 'Paused' : 'Recording',
statusColor: paused ? '#B9B7C8' : '#FF7A8A',
toggleLabel: paused ? 'Resume' : 'Pause',
toggleBg: paused ? '#5EE0C6' : '#26262E',
toggleFg: paused ? '#06231E' : '#F4F3F8',
toggleShadow: 'none',
toggle: () => this.setState({ paused: !paused })
};
}
}
</script>
</body>
</html>
