<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mac settings general</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5EE0C6}a:hover{color:#7FF2DA}
@keyframes pop{0%{opacity:0;transform:scale(.96)}100%{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ring{0%,100%{border-color:#5EE0C6}50%{border-color:#2D5A50}}
.tab{transition:background-color .15s}
.tab:hover{background-color:#22222A}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #1A1A21; color: #F4F3F8; font-family: 'Inter', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; border-radius: 12px; overflow: hidden">
<div role="dialog" aria-label="Settings" style="width: 680px; border-radius: 14px; background: #16161C; border: 1px solid #2A2A33; box-shadow: 0 30px 80px rgba(0,0,0,0.55); overflow: hidden; animation: pop .3s cubic-bezier(.2,.8,.2,1) both">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 14px 10px; border-bottom: 1px solid #22222A">
<div style="align-self: stretch; display: flex; gap: 8px"><a href="Main.dc.html" aria-label="Close settings" style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></a><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 6px; background: #3A3A46"></span><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 6px; background: #3A3A46"></span></div>
<nav aria-label="Settings tabs" style="display: flex; gap: 4px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" class="tab" style="width: 88px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border-radius: 8px; background: {{t.bg}}; color: {{t.fg}}; text-decoration: none; font-size: 11px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg>{{t.label}}
</a>
</sc-for>
</nav>
</div>
<div style="padding: 24px 40px 28px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px 18px; align-items: center">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<span style="text-align: right; font-size: 13px; color: #D8D6E4; animation: rise .3s {{r.delay}}s both">{{r.label}}</span>
<div style="display: flex; flex-direction: column; gap: 4px; animation: rise .3s {{r.delay}}s both">
<sc-if value="{{r.isCheck}}" hint-placeholder-val="{{false}}"><label style="display: flex; align-items: center; gap: 8px; font-size: 13px"><input type="checkbox" checked="{{r.on}}" onChange="{{r.toggle}}" style="width: 15px; height: 15px; accent-color: #5EE0C6; margin: 0">{{r.text}}</label></sc-if>
<sc-if value="{{r.isSelect}}" hint-placeholder-val="{{true}}"><label style="display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{r.label}}</span><select style="height: 28px; min-width: 220px; padding: 0 8px; border-radius: 7px; background: #1C1C23; border: 1px solid #2E2E38; color: #F4F3F8; font: inherit; font-size: 13px"><option>{{r.text}}</option><option>{{r.alt}}</option></select></label></sc-if>
<sc-if value="{{r.isShortcut}}" hint-placeholder-val="{{false}}"><button onClick="{{r.recordKey}}" style="width: 160px; height: 28px; border-radius: 7px; background: #1C1C23; border: 1.5px solid {{r.keyBorder}}; color: #F4F3F8; font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; animation: {{r.keyAnim}}">{{r.keyText}}</button></sc-if>
<sc-if value="{{r.hasHint}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; color: #8F8D9C">{{r.hint}}</span></sc-if>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const c = st.c || { login: true, menu: true, dock: false, del: false };
const flip = (k) => () => { const n = Object.assign({}, c); n[k] = !n[k]; this.setState({ c: n }); };
const tabs = [
{ label: 'General', icon: 'M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4', href: 'SettingsGeneral.dc.html', on: true },
{ label: 'Transcription', icon: 'M4 6h16M4 12h10M4 18h7', href: '#', on: false },
{ label: 'Dictionary', icon: 'M4 4h11a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4zM8 8h7M8 12h5', href: 'SettingsDictionary.dc.html', on: false },
{ label: 'Shortcuts', icon: 'M3 7h18v10H3zM7 11h1M11 11h2M16 11h1M8 14h8', href: '#', on: false },
{ label: 'Account', icon: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0', href: 'Paywall.dc.html', on: false }
].map((t) => ({ ...t, bg: t.on ? '#26262E' : 'transparent', fg: t.on ? '#5EE0C6' : '#B9B7C8' }));
const chk = (label, text, key, hint) => ({ label, text, isCheck: true, isSelect: false, isShortcut: false, on: !!c[key], toggle: flip(key), hint: hint || '', hasHint: !!hint });
const sel = (label, text, alt, hint) => ({ label, text, alt, isCheck: false, isSelect: true, isShortcut: false, hint: hint || '', hasHint: !!hint });
const raw = [
chk('Startup:', 'Open Murmur at login', 'login'),
chk('Menu bar:', 'Show Murmur in the menu bar', 'menu', 'Start and stop recordings without opening the window.'),
{ label: 'Record shortcut:', isCheck: false, isSelect: false, isShortcut: true, hint: 'Works from any app.', hasHint: true, keyText: st.listening ? 'Press keys…' : '⌃ ⌥ R', keyBorder: st.listening ? '#5EE0C6' : '#2E2E38', keyAnim: st.listening ? 'ring 1s ease-in-out infinite' : 'none', recordKey: () => this.setState({ listening: !st.listening }) },
sel('Save new notes to:', 'Inbox', 'Meetings'),
sel('Recording format:', 'M4A (AAC)', 'WAV (lossless)'),
chk('Storage:', 'Delete audio after transcribing', 'del', 'Keeps the transcript, frees disk space.'),
chk('Dock:', 'Hide Dock icon while recording', 'dock')
];
const rows = raw.map((r, i) => Object.assign({}, r, { delay: (0.05 + i * 0.03).toFixed(2) }));
return { tabs, rows };
}
}
</script>
</body>
</html>
