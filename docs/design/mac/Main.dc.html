<!doctype html>
<html lang="en">
<head>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5EE0C6}a:hover{color:#7FF2DA}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.press{transition:background-color .2s,border-color .2s,color .2s,transform .15s}
.press:active{transform:scale(.97)!important}
.hov{transition:background-color .15s}
.hov:hover{background-color:#22222A}

<span style="font-size: 13px; color: #8F8D9C">21 notes</span>
<div style="flex-grow: 1"></div>

<a href="Recording.dc.html" class="press" style="height: 30px; padding: 0 14px; border-radius: 8px; background: #5EE0C6; color: #06231E; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; text-decoration: none"><span style="width: 8px; height: 8px; border-radius: 4px; background: #FF5A6E"></span>Record  ⌃⌥R</a>
</header>
<div style="flex-grow: 1; display: flex; min-height: 0">

<span style="padding: 4px 8px 4px; font-size: 11px; font-weight: 700; color: #8F8D9C">Library</span>

</sc-for>
<span style="padding: 14px 8px 4px; font-size: 11px; font-weight: 700; color: #8F8D9C">Folders</span>
<sc-for list="{{folders}}" as="f" hint-placeholder-count="5">
<a href="#" class="hov" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 7px; color: #F4F3F8; text-decoration: none; font-size: 13px"><span style="width: 9px; height: 9px; border-radius: 3px; background: {{f.color}}"></span><span style="flex-grow: 1">{{f.name}}</span><span style="font-size: 12px; color: #8F8D9C">{{f.count}}</span></a>
</sc-for>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
<a href="Queue.dc.html" class="hov" style="display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; color: #F4F3F8; text-decoration: none; font-size: 12px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 7px; border: 2px solid #3A3A46; border-top-color: #5EE0C6; box-sizing: border-box"></span>Transcribing 1 of 3</a>
<a href="SettingsGeneral.dc.html" class="hov" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 7px; color: #B9B7C8; text-decoration: none; font-size: 13px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</a>
</div>
</nav>
<section aria-label="Notes" style="width: 320px; flex-shrink: 0; border-right: 1px solid #22222A; padding: 10px 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="7">
<button onClick="{{n.pick}}" class="press" style="text-align: left; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 10px; border: none; background: {{n.bg}}; animation: rise .35s {{n.delay}}s cubic-bezier(.2,.8,.2,1) both">
<span style="display: flex; justify-content: space-between; gap: 8px"><span style="display: flex; align-items: center; gap: 8px; min-width: 0"><span style="flex-shrink: 0; width: 8px; height: 8px; border-radius: 4px; background: {{n.color}}"></span><span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.title}}</span></span><span style="font-size: 12px; color: {{n.sub}}; white-space: nowrap">{{n.dur}}</span></span>
<span style="font-size: 12px; color: {{n.sub}}; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 16px">{{n.snippet}}</span>
<span style="font-size: 11px; color: #8F8D9C; padding-left: 16px">{{n.when}}</span>
</button>
</sc-for>
</section>
<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; padding: 24px 32px 18px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; animation: fadeIn .35s cubic-bezier(.2,.8,.2,1) both">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">{{cur.title}}</h1><span style="font-size: 13px; color: #B9B7C8">{{cur.meta}}</span></div>
<div style="display: flex; gap: 6px; flex-shrink: 0">
<a href="NoteInspector.dc.html" class="press" style="height: 30px; padding: 0 12px; border-radius: 8px; background: #1C1C23; border: 1px solid #2A2A33; color: #F4F3F8; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-decoration: none"><svg width="12" height="12" viewBox="0 0 24 24" fill="#5EE0C6" aria-hidden="true"><path d="M12 2l2.2 6.3L20 10l-5.8 1.7L12 18l-2.2-6.3L4 10l5.8-1.7z"/></svg>Summary</a>
<a href="Export.dc.html" class="press" style="height: 30px; padding: 0 12px; border-radius: 8px; background: #1C1C23; border: 1px solid #2A2A33; color: #F4F3F8; display: flex; align-items: center; font-size: 13px; font-weight: 600; text-decoration: none">Export  ⌘E</a>
</div>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; padding-top: 18px; overflow: hidden">
<sc-for list="{{segs}}" as="s" hint-placeholder-count="6">
<button onClick="{{s.seek}}" class="press" style="text-align: left; font: inherit; color: inherit; display: flex; gap: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid {{s.border}}; background: {{s.bg}}; animation: fadeIn .35s {{s.delay}}s cubic-bezier(.2,.8,.2,1) both">
<span style="flex-shrink: 0; width: 96px; display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600"><span style="width: 7px; height: 7px; border-radius: 4px; background: {{s.dot}}"></span>{{s.who}}</span><span style="font-size: 11px; color: #8F8D9C; padding-left: 13px; font-variant-numeric: tabular-nums">{{s.t}}</span></span>
<span style="flex-grow: 1; font-size: 14px; line-height: 1.6; color: {{s.fg}}">{{s.text}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 12px; background: #1C1C23; border: 1px solid #2A2A33">
<button class="press" onClick="{{toggle}}" aria-label="{{playLabel}}" style="width: 34px; height: 34px; border-radius: 17px; border: none; background: #5EE0C6; color: #06231E; display: flex; align-items: center; justify-content: center">
<sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></sc-if>
<sc-if value="{{stopped}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.8l-10-6.5A1 1 0 0 0 8 5.5z"/></svg></sc-if>
</button>
<span style="font-size: 12px; color: #B9B7C8; font-variant-numeric: tabular-nums">{{curTime}}</span>
<div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2E2E38"><div style="height: 4px; border-radius: 2px; background: #5EE0C6; width: {{progress}}%; transition: width .6s cubic-bezier(.2,.8,.2,1)"></div></div>
<span style="font-size: 12px; color: #B9B7C8">{{cur.dur}}</span>
<span style="font-size: 11px; color: #8F8D9C">Space to play</span>
</div>
</main>
</div>
</div>
</x-dc>

];
