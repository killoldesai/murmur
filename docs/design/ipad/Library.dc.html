<helmet>

<div style="display: flex; gap: 8px">

</div>
</div>
</nav>

<section aria-label="Notes" style="width: 360px; flex-shrink: 0; border-right: 1px solid #22222A; display: flex; flex-direction: column; padding: 36px 16px 0; box-sizing: border-box; animation: rise .55s .06s cubic-bezier(.2,.8,.2,1) both">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px 14px">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em">All notes</h1>
<span style="font-size: 13px; color: #B9B7C8">21</span>
</div>
<a href="Search.dc.html" class="press" style="display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border-radius: 12px; background: #1C1C23; border: 1px solid #2A2A33; color: #B9B7C8; text-decoration: none; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search transcripts</a>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 14px; overflow: hidden">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="5">
<button class="press" onClick="{{n.pick}}" style="text-align: left; font: inherit; color: inherit; display: flex; gap: 12px; padding: 12px; border-radius: 16px; border: 1px solid {{n.border}}; background: {{n.bg}}; animation: rise .45s {{n.delay}}s cubic-bezier(.2,.8,.2,1) both">
<span style="flex-shrink: 0; width: 38px; height: 38px; border-radius: 11px; background: {{n.color}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111116" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"/></svg></span>

<span style="font-size: 13px; color: #B9B7C8; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.snippet}}</span>
<span style="font-size: 12px; color: #8F8D9C">{{n.when}}</span>

</button>
</sc-for>
</div>
</section>

<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; padding: 36px 32px 24px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; animation: fadeIn .45s cubic-bezier(.2,.8,.2,1) both">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<h2 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15">{{cur.title}}</h2>
<span style="font-size: 14px; color: #B9B7C8">{{cur.meta}}</span>
</div>
<div style="display: flex; gap: 8px; flex-shrink: 0">
<a href="Note.dc.html" class="press" style="height: 40px; padding: 0 14px; border-radius: 12px; background: #1C1C23; border: 1px solid #2A2A33; color: #F4F3F8; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="#5EE0C6" aria-hidden="true"><path d="M12 2l2.2 6.3L20 10l-5.8 1.7L12 18l-2.2-6.3L4 10l5.8-1.7z"/></svg>Summary</a>
<button class="press" aria-label="Export" style="width: 40px; height: 40px; border-radius: 12px; background: #1C1C23; border: 1px solid #2A2A33; color: #F4F3F8; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button>
</div>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; padding-top: 22px; overflow: hidden">
<sc-for list="{{segs}}" as="s" hint-placeholder-count="5">
<div style="display: flex; gap: 16px; padding: 12px 14px; border-radius: 14px; border: 1px solid {{s.border}}; background: {{s.bg}}; transition: background-color .35s, border-color .35s; animation: fadeIn .45s {{s.delay}}s cubic-bezier(.2,.8,.2,1) both">
<span style="flex-shrink: 0; width: 110px; display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{s.dot}}"></span>{{s.who}}</span><span style="font-size: 12px; color: #8F8D9C; font-variant-numeric: tabular-nums; padding-left: 15px">{{s.t}}</span></span>
<span style="font-size: 16px; line-height: 1.55; color: {{s.fg}}">{{s.text}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-radius: 20px; background: #1C1C23; border: 1px solid #2A2A33">
<button class="press" onClick="{{toggle}}" aria-label="{{playLabel}}" style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 24px; border: none; background: #5EE0C6; color: #06231E; display: flex; align-items: center; justify-content: center">
<sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></sc-if>
<sc-if value="{{stopped}}" hint-placeholder-val="{{true}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.8l-10-6.5A1 1 0 0 0 8 5.5z"/></svg></sc-if>
</button>
<span style="font-size: 13px; color: #B9B7C8; font-variant-numeric: tabular-nums">{{curTime}}</span>
<div style="flex-grow: 1; height: 5px; border-radius: 3px; background: #2E2E38"><div style="height: 5px; border-radius: 3px; background: #5EE0C6; width: {{progress}}%; transition: width .6s cubic-bezier(.2,.8,.2,1)"></div></div>
<span style="font-size: 13px; color: #B9B7C8; font-variant-numeric: tabular-nums">{{cur.dur}}</span>
<span style="height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid #2A2A33; font-size: 12px; font-weight: 700; display: flex; align-items: center">1×</span>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>

const sel = st.sel || 0;
const seg = st.seg == null ? 0 : st.seg;
const playing = !!st.playing;
const icons = {

lect: 'M3 8l9-4 9 4-9 4-9-4zM7 10v5c0 1.5 2.2 3 5 3s5-1.5 5-3v-5',
mic: 'M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3'
};
const data = [
{ title: 'Product sync — Q4 roadmap', dur: '42:10', when: 'Today · 10:30 AM', meta: 'Oct 25 · 42:10 · 3 speakers · Meetings', color: '#5EE0C6', icon: icons.meet, snippet: 'We agreed to ship the Watch app first…',
segs: [['Alex', '#5EE0C6', '00:04', 'Okay, let’s start with the Q4 roadmap. The big question is Watch first or sync first.'], ['Priya', '#FFB86B', '00:15', 'Watch is smaller, and it’s the most requested feature in support emails.'], ['Jordan', '#A9B4FF', '00:24', 'Sync needs CloudKit migration work. That’s at least three weeks on its own.'], ['Alex', '#5EE0C6', '00:33', 'Then Watch first, and we move sync to December.'], ['Priya', '#FFB86B', '00:40', 'I’ll update the timeline and share it by Friday.']] },

segs: [['You', '#FFB86B', '00:02', 'Idea for onboarding: show the airplane-mode demo first.'], ['You', '#FFB86B', '00:09', 'People don’t believe it works offline until they see it.'], ['You', '#FFB86B', '00:18', 'Maybe a ten-second clip right after the splash screen.']] },
{ title: 'Biology 201 — Lecture 8', dur: '1:12:04', when: 'Yesterday · 2:00 PM', meta: 'Oct 24 · 1:12:04 · 1 speaker · Lectures', color: '#A9B4FF', icon: icons.lect, snippet: 'Cellular respiration, starting with glycolysis…',

{ title: 'Weekly 1:1 with Sam', dur: '27:48', when: 'Oct 21', meta: 'Oct 21 · 27:48 · 2 speakers · Meetings', color: '#5EE0C6', icon: icons.meet, snippet: 'Let’s talk about the launch checklist…',
segs: [['Sam', '#8FD3FF', '00:03', 'Let’s talk about the launch checklist.'], ['You', '#5EE0C6', '00:10', 'Screenshots are the last open item.']] }
];
const notes = data.map((n, i) => {
const on = i === sel;
return { ...n, bg: on ? '#16302B' : 'transparent', border: on ? '#2D5A50' : 'transparent', delay: (0.1 + i * 0.05).toFixed(2), pick: () => this.setState({ sel: i, seg: 0 }) };
});
const cur = data[sel];
const segs = cur.segs.map((s, i) => {
const on = i === seg;
return { who: s[0], dot: s[1], t: s[2], text: s[3], bg: on ? '#16302B' : 'transparent', border: on ? '#5EE0C6' : 'transparent', fg: on ? '#F4F3F8' : '#B9B7C8', delay: (0.05 + i * 0.04).toFixed(2) };
});
const nav = [
{ label: 'All notes', count: '21', icon: 'M4 6h16M4 12h16M4 18h10', href: 'Library.dc.html', on: true },
{ label: 'Recent', count: '5', icon: 'M12 7v5l3 2M21 12a9 9 0 1 1-9-9 9 9 0 0 1 9 9z', href: '#', on: false },

].map((n) => ({ ...n, bg: n.on ? '#26262E' : 'transparent', weight: n.on ? 600 : 400, iconColor: n.on ? '#5EE0C6' : '#B9B7C8' }));

const n = cur.segs.length;
return {
