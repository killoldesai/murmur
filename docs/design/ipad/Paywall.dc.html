<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPad Paywall</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5EE0C6}a:hover{color:#7FF2DA}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes wave{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.press{transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .3s,border-color .3s}
.press:active{transform:scale(.97)!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; background: #111116; color: #F4F3F8; font-family: 'Inter', system-ui, sans-serif; display: flex; position: relative; overflow: hidden">
<a href="Settings.dc.html" aria-label="Close" style="position: absolute; top: 28px; right: 28px; width: 42px; height: 42px; border-radius: 21px; background: #1C1C23; border: 1px solid #2A2A33; color: #B9B7C8; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<section style="width: 540px; flex-shrink: 0; padding: 80px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px; border-right: 1px solid #22222A">
<div style="width: 112px; height: 112px; animation: float 4.5s ease-in-out infinite">
<svg width="112" height="112" viewBox="0 0 100 100" role="img" aria-label="Murmur icon"><rect width="100" height="100" rx="22.5" fill="#15151B"/><rect x="0.5" y="0.5" width="99" height="99" rx="22" fill="none" stroke="#2A2A33"/><g stroke="#5EE0C6" stroke-width="7.5" stroke-linecap="round"><line x1="26" y1="27" x2="26" y2="73" style="transform-origin: 26px 50px; animation: wave 1.4s ease-in-out infinite"/><line x1="38" y1="35" x2="38" y2="62" style="transform-origin: 38px 50px; animation: wave 1.4s ease-in-out -.2s infinite"/><line x1="50" y1="45" x2="50" y2="55" style="transform-origin: 50px 50px; animation: wave 1.4s ease-in-out -.4s infinite"/><line x1="62" y1="35" x2="62" y2="62" style="transform-origin: 62px 50px; animation: wave 1.4s ease-in-out -.6s infinite"/><line x1="74" y1="27" x2="74" y2="73" style="transform-origin: 74px 50px; animation: wave 1.4s ease-in-out -.8s infinite"/></g></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; animation: rise .55s .05s cubic-bezier(.2,.8,.2,1) both">
<h1 style="margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -0.035em">Murmur <span style="color: #5EE0C6">Pro</span></h1>
<p style="margin: 0; font-size: 18px; color: #D8D6E4; line-height: 1.5">Unlimited, private transcription on iPhone, iPad and Mac. One purchase covers all three.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{perks}}" as="p" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 14px; animation: rise .5s {{p.delay}}s cubic-bezier(.2,.8,.2,1) both">
<span style="flex-shrink: 0; width: 34px; height: 34px; border-radius: 11px; background: {{p.color}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111116" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span>
<span style="font-size: 16px; color: #ECEBF2">{{p.text}}</span>
</div>
</sc-for>
</div>
</section>
<section style="flex-grow: 1; padding: 80px 64px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0 0 8px; font-size: 20px; font-weight: 800">Choose a plan</h2>
<div role="radiogroup" aria-label="Choose a plan" style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{plans}}" as="pl" hint-placeholder-count="3">
<div style="display: flex; animation: rise .5s {{pl.delay}}s cubic-bezier(.2,.8,.2,1) both">
<button role="radio" aria-checked="{{pl.checked}}" class="press" onClick="{{pl.pick}}" style="flex-grow: 1; position: relative; text-align: left; font: inherit; color: inherit; display: flex; align-items: center; gap: 16px; padding: 20px 22px; border-radius: 20px; border: 1.5px solid {{pl.border}}; background: {{pl.bg}}">
<span style="flex-shrink: 0; width: 24px; height: 24px; border-radius: 12px; border: 2px solid {{pl.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 11px; height: 11px; border-radius: 6px; background: #5EE0C6; transform: scale({{pl.dot}}); transition: transform .35s cubic-bezier(.2,.8,.2,1)"></span></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 18px; font-weight: 700">{{pl.name}}</span><span style="font-size: 14px; color: #B9B7C8">{{pl.sub}}</span></span>
<span style="font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums">{{pl.price}}</span>
<sc-if value="{{pl.hasBadge}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: -11px; right: 18px; height: 22px; padding: 0 10px; border-radius: 11px; background: {{pl.badgeBg}}; color: #06231E; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; display: flex; align-items: center">{{pl.badge}}</span></sc-if>
</button>
</div>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<button class="press" style="height: 60px; border-radius: 18px; border: none; background: #5EE0C6; color: #06231E; font: inherit; font-size: 18px; font-weight: 800">{{cta}}</button>
<div style="display: flex; justify-content: center; gap: 22px">
<button style="border: none; background: transparent; color: #B9B7C8; font: inherit; font-size: 14px; min-height: 44px">Restore purchases</button>
<a href="#terms" style="color: #B9B7C8; font-size: 14px; display: flex; align-items: center; min-height: 44px">Terms</a>
<a href="#privacy" style="color: #B9B7C8; font-size: 14px; display: flex; align-items: center; min-height: 44px">Privacy</a>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const sel = st.plan || 'yearly';
const perks = [['Unlimited transcription length', '#5EE0C6'], ['Speaker labels and AI summaries', '#FFB86B'], ['Batch import and SRT subtitles', '#A9B4FF'], ['iPhone, iPad, Mac & Watch', '#8FD3FF'], ['No account, no cloud, ever', '#FF8FA3']].map((p, i) => ({ text: p[0], color: p[1], delay: (0.1 + i * 0.05).toFixed(2) }));
const raw = [
{ id: 'yearly', name: 'Yearly', sub: '$1.67 a month · 7-day free trial', price: '$19.99', badge: 'BEST VALUE' },
{ id: 'lifetime', name: 'Lifetime', sub: 'Pay once, yours forever', price: '$39.99', badge: 'NO SUBSCRIPTION' },
{ id: 'monthly', name: 'Monthly', sub: 'Cancel anytime', price: '$3.99', badge: '' }
];
const plans = raw.map((p, i) => {
const on = p.id === sel;
return { ...p, hasBadge: !!p.badge, badgeBg: i === 0 ? '#5EE0C6' : '#A9B4FF', checked: on ? 'true' : 'false', border: on ? '#5EE0C6' : '#2A2A33', bg: on ? '#16302B' : '#1C1C23', ring: on ? '#5EE0C6' : '#4A4A56', dot: on ? 1 : 0, delay: (0.2 + i * 0.06).toFixed(2), pick: () => this.setState({ plan: p.id }) };
});
const cta = sel === 'yearly' ? 'Start 7-day free trial' : sel === 'lifetime' ? 'Unlock forever · $39.99' : 'Continue · $3.99/month';
return { perks, plans, cta };
}
}
</script>
</body>
</html>
