# Manual release: archives the app and uploads it to App Store Connect (TestFlight).
#
# NOT TESTED. It cannot run until you have an Apple Developer account, the bundle IDs, and these
# repository secrets (Settings > Secrets and variables > Actions). See store/RELEASE.md.
#   APPLE_TEAM_ID        your 10-character team ID
#   ASC_KEY_ID           App Store Connect API key ID
#   ASC_ISSUER_ID        App Store Connect issuer ID
#   ASC_KEY_P8_BASE64    the .p8 key file: paste its text as it is, or base64-encode it first
# Signing is automatic and cloud-managed through the API key, so no certificates are stored here.
name: Release (manual)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "What to upload"
        type: choice
        options: [ios, mac]
        default: ios

permissions:
  contents: write   # lets the last step publish the build log to the release-results branch

jobs:
  archive-and-upload:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # The secret may hold the raw .p8 text, its base64, or just the key body. Rebuild a clean PEM.
          python3 - <<'PY'
          import base64, os, re, textwrap
          v = os.environ["ASC_KEY_P8_BASE64"].replace("\r", "").strip()
          if "BEGIN" not in v:
              try:
                  d = base64.b64decode(v, validate=False).decode("utf-8", "ignore")
              except Exception:
                  d = ""
              v = d.replace("\r", "").strip() if "BEGIN" in d else v
          if "BEGIN" in v:
              body = re.sub(r"-----[A-Z ]+-----|\s+", "", v)
          else:
              body = re.sub(r"\s+", "", v)
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          open(os.path.join(os.environ["RUNNER_TEMP"], "keys", "AuthKey_" + os.environ["ASC_KEY_ID"] + ".p8"), "w").write(pem)
          print("key body characters:", len(body))
          PY
          if openssl pkey -in "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" -noout; then echo "p8 key parses OK"; else echo "p8 key is NOT a valid private key (check the ASC_KEY_P8_BASE64 secret)"; exit 1; fi
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Set the build number to the run number
        run: |
          # TestFlight needs every upload to have a higher build number than the last.
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          xcodegen generate

      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          mkdir -p build
          if [ "${{ inputs.platform }}" = "mac" ]; then
            SCHEME=MurmurMac; DEST="generic/platform=macOS"
          else
            SCHEME=Murmur; DEST="generic/platform=iOS"
          fi
          xcodebuild archive \
            -project Murmur.xcodeproj -scheme "$SCHEME" -destination "$DEST" \
            -archivePath "$RUNNER_TEMP/Murmur.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | tee build/archive.log

      - name: Export and upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          mkdir -p build
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Murmur.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee build/export.log

      - name: Publish the build log to the release-results branch
        if: always()
        run: |
          rm -rf /tmp/results && mkdir /tmp/results
          for f in build/*.log; do [ -f "$f" ] && tail -n 800 "$f" > "/tmp/results/$(basename "$f")"; done
          grep -hE "error:|Error:|warning: .*(provisioning|signing|entitlement)" build/*.log > /tmp/results/summary.txt 2>/dev/null || true
          echo "commit $GITHUB_SHA" >> /tmp/results/summary.txt
          cd /tmp/results
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b release-results
          git add -A
          git commit -q -m "Release results for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" release-results
