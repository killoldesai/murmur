name: CI

on:
  push:
    branches-ignore: [ci-results]
    paths-ignore: ['**.md', 'docs/**']      # docs-only changes don't need a build
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# A newer push cancels a run that is still going, so no minutes are spent on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # lets the last step publish logs and screenshots to the ci-results branch

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          mkdir -p build
          { xcodebuild -version; swift --version; } | tee build/toolchain.log
          xcrun simctl list devices available | head -40

      - name: Test packages (MurmurCore, MurmurUI, MurmurWhisper)
        run: |
          set -o pipefail
          swift test 2>&1 | tee build/swift-test.log | tail -60

      # Real Whisper (tiny model) transcribing speech made by macOS `say`. Needs the network and a
      # few minutes, so it is a separate step and does not fail the build; read e2e.log.
      - name: End-to-end transcription test (tiny model)
        continue-on-error: true
        run: |
          set -o pipefail
          MURMUR_E2E=1 swift test --filter WhisperEndToEndTests 2>&1 | tee build/e2e.log | tail -40

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devs = json.load(sys.stdin)['devices']
          print(next(d['udid'] for k, v in devs.items() if 'iOS' in k for d in v if 'iPhone' in d['name']))
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator: $UDID"

      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Murmur.xcodeproj \
            -scheme Murmur \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild.log | tail -60

      - name: Run in simulator and screenshot screens
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find DerivedData -name Murmur.app -path "*iphonesimulator*" | head -1)
          echo "App: $APP"
          xcrun simctl install "$UDID" "$APP"
          shot() {  # shot <name> <seconds to wait> <launch arguments...>
            NAME="$1"; WAIT="$2"; shift 2
            xcrun simctl launch "$UDID" app.murmur.Murmur "$@"
            sleep "$WAIT"
            xcrun simctl io "$UDID" screenshot "build/$NAME.png"
            xcrun simctl terminate "$UDID" app.murmur.Murmur || true
          }
          shot home 4
          shot recording 5 -screen recording
          shot recording-paused 5 -screen recordingPaused
          shot gallery-0 4 -screen gallery -gallerySection 0
          shot model-download 4 -screen modelDownload
          shot model-downloading 5 -screen modelDownloading
          shot model-done 5 -screen modelDone
          shot transcribing 5 -screen transcribing
          shot library 5 -screen library
          shot library-empty 5 -screen libraryEmpty
          shot note 5 -screen note
          shot note-edit 5 -screen noteEdit
          shot summary 5 -screen summary
          shot search 5 -screen search
          shot paywall 5 -screen paywall
          shot splash 5 -screen splash
          shot onboarding 5 -screen onboarding
          shot onboarding-mic 5 -screen onboardingMic
          shot settings 5 -screen settings
          shot note-locked 5 -screen noteLocked
          shot dictionary 5 -screen dictionary
          shot find-replace 5 -screen findReplace
          shot import 5 -screen import
          shot export 5 -screen export
          shot transcribing-done 5 -screen transcribingDone

          # iPad layouts: the same build on an iPad simulator.
          IPAD=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devs = json.load(sys.stdin)['devices']
          print(next((d['udid'] for k, v in devs.items() if 'iOS' in k for d in v if 'iPad' in d['name']), ''))
          ")
          if [ -n "$IPAD" ]; then
            UDID="$IPAD"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            shot ipad-library 9 -screen library
            shot ipad-note-wide 9 -screen noteWide
            shot ipad-recording 9 -screen recording
            shot ipad-search 9 -screen search
            shot ipad-import 9 -screen import
            shot ipad-settings 9 -screen settings
            shot ipad-onboarding 9 -screen onboarding
            shot ipad-paywall 9 -screen paywall
          fi

      - name: Build macOS app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Murmur.xcodeproj \
            -scheme MurmurMac \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath DerivedDataMac \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild-mac.log | tail -60

      # The Mac app writes its own window to a PNG (-snapshot) and quits, so no screen-recording
      # permission is needed. Each screen is a separate launch with demo data.
      - name: Run Mac app and snapshot screens
        continue-on-error: true
        run: |
          APP=$(find DerivedDataMac -name Murmur.app -path "*Build/Products/Debug/*" | head -1)
          BIN="$APP/Contents/MacOS/Murmur"
          echo "Mac app: $APP"
          macshot() {  # macshot <name> <launch arguments...>
            NAME="$1"; shift
            rm -f "build/mac-$NAME.png"
            "$BIN" "$@" -snapshot "$PWD/build/mac-$NAME.png" > "build/mac-$NAME.log" 2>&1 &
            PID=$!
            for i in $(seq 1 45); do sleep 1; kill -0 $PID 2>/dev/null || break; done
            kill $PID 2>/dev/null || true
            ls -la "build/mac-$NAME.png" || echo "no snapshot for $NAME"
          }
          macshot main -screen main
          macshot note-locked -screen noteLocked
          macshot queue -screen queue
          macshot drop -screen drop
          macshot export -screen export
          macshot paywall -screen paywall
          macshot recording -screen recording
          macshot menubar -screen menubar
          macshot settings -screen settings
          macshot dictionary -screen dictionary
          macshot account -screen account
          macshot onboarding -screen onboarding
          macshot onboarding-mic -screen onboardingMic
          macshot onboarding-shortcut -screen onboardingShortcut
          macshot onboarding-model -screen onboardingModel

      - name: Publish results to ci-results branch
        if: always()
        run: |
          rm -rf /tmp/results && mkdir /tmp/results
          cp build/*.png /tmp/results/ 2>/dev/null || true
          for f in build/*.log; do [ -f "$f" ] && tail -n 600 "$f" > "/tmp/results/$(basename "$f")"; done
          grep -hE "error:|warning:|Executed [0-9]+ tests|with [0-9]+ failure|E2E transcript" build/*.log > /tmp/results/summary.txt 2>/dev/null || true
          echo "commit $GITHUB_SHA" >> /tmp/results/summary.txt
          cd /tmp/results
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-results
          git add -A
          git commit -q -m "CI results for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-results
