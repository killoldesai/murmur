name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | head -40

      - name: Test packages (MurmurCore, MurmurUI)
        run: |
          mkdir -p build
          set -o pipefail
          swift test 2>&1 | tee build/swift-test.log | tail -60

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devs = json.load(sys.stdin)['devices']
          print(next(d['udid'] for k, v in devs.items() if 'iOS' in k for d in v if 'iPhone' in d['name']))
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator: $UDID"

      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Murmur.xcodeproj \
            -scheme Murmur \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild.log | tail -60

      - name: Run in simulator and screenshot
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find DerivedData -name Murmur.app -path "*iphonesimulator*" | head -1)
          echo "App: $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" app.murmur.Murmur
          sleep 6
          xcrun simctl io "$UDID" screenshot build/gallery-top.png
          xcrun simctl terminate "$UDID" app.murmur.Murmur || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-results
          path: build/
          if-no-files-found: ignore
