# XcodeGen spec. The .xcodeproj is generated (never committed):  xcodegen generate
name: Murmur
options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"
  createIntermediateGroups: true
packages:
  MurmurKit:
    path: .
targets:
  Murmur:
    type: application
    platform: iOS
    sources:
      - App/Murmur
      - App/Shared
    dependencies:
      - package: MurmurKit
        product: MurmurUI
      - package: MurmurKit
        product: MurmurCore
      - package: MurmurKit
        product: MurmurWhisper
      # The Apple Watch app is delivered inside the iPhone app.
      - target: MurmurWatch
    info:
      path: App/Murmur/Info.plist
      properties:
        CFBundleDisplayName: Murmur
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSMicrophoneUsageDescription: Murmur records your voice so it can turn speech into text on your device. Audio never leaves your phone.
        # Lets a recording continue with the screen locked or the app in the background.
        # Lets "Share → Murmur" and "Open in Murmur" offer the app for audio and video files.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie]
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # Placeholder: replace with the real bundle ID from your Apple Developer account.
        PRODUCT_BUNDLE_IDENTIFIER: app.murmur.Murmur
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  MurmurMac:
    type: application
    platform: macOS
    sources:
      - App/MurmurMac
      - App/Shared
    dependencies:
      - package: MurmurKit
        product: MurmurUI
      - package: MurmurKit
        product: MurmurCore
      - package: MurmurKit
        product: MurmurWhisper
    info:
      path: App/MurmurMac/Info.plist
      properties:
        CFBundleDisplayName: Murmur
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Murmur records your voice so it can turn speech into text on your Mac. Audio never leaves your Mac.
        # "Open with Murmur" and dropping files on the Dock icon.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie]
    entitlements:
      path: App/MurmurMac/Murmur.entitlements
      properties:
        # App Sandbox with only what Murmur needs: microphone, files the person picks or drops,
        # and the network for the model download and StoreKit.
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    settings:
      base:
        # Same bundle ID as the iOS app: one purchase covers iPhone, iPad and Mac (universal purchase).
        PRODUCT_BUNDLE_IDENTIFIER: app.murmur.Murmur
        PRODUCT_NAME: Murmur
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ARCHS: arm64

  MurmurWatch:
    type: application
    platform: watchOS
    sources:
      - App/MurmurWatch
    dependencies:
      - package: MurmurKit
        product: MurmurUI
      - package: MurmurKit
        product: MurmurCore
      - target: MurmurWatchWidget
    info:
      path: App/MurmurWatch/Info.plist
      properties:
        CFBundleDisplayName: Murmur
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.murmur.Murmur
        NSMicrophoneUsageDescription: Murmur records your voice on your watch and sends it to your iPhone to turn into text.
        # Keeps a recording going with the wrist down.
        WKBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.murmur.Murmur.watchkitapp
        PRODUCT_NAME: MurmurWatch
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  MurmurWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - App/MurmurWatchWidget
      - path: App/MurmurWatch/WatchWidgetViews.swift
    dependencies:
      - package: MurmurKit
        product: MurmurUI
      - package: MurmurKit
        product: MurmurCore
    info:
      path: App/MurmurWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Murmur
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.murmur.Murmur.watchkitapp.widget
        PRODUCT_NAME: MurmurWatchWidget
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
